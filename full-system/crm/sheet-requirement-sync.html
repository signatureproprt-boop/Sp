<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sheet requirement sync — Signature Properties</title><style>body{font:16px system-ui;background:#f6f2eb;color:#423126;margin:0}main{max-width:650px;margin:32px auto;padding:24px;background:white;border:1px solid #ded4c6;border-radius:12px}button,a{padding:10px;display:inline-block}button{background:#624532;color:white;border:0;border-radius:6px;cursor:pointer}dt{font-weight:600;margin-top:14px}dd{margin:4px 0;overflow-wrap:anywhere}#error{color:#b42318}</style></head><body><main><a href="/clients">← Clients</a><h1>Sheet requirement sync</h1><p>CRM requirements update the existing Requirement cell in the same lead row in Comm, Sale and Rent.</p><button id="refresh">Refresh status</button> <button id="sync">Sync saved requirements</button><p id="error" role="alert"></p><dl id="status" aria-live="polite"></dl></main><script>
const status=document.getElementById('status'),error=document.getElementById('error');
async function load(method='GET'){
 error.textContent='';document.getElementById('sync').disabled=true;
 try{const response=await fetch('/api/sync/existing-sheet-requirement',{method,credentials:'include'});const json=await response.json();const data=json.data||json;
 status.replaceChildren();
 for(const [label,value] of Object.entries({'State':data.state||'Unknown','Configured':data.configured===false?'No':'Yes','Cells updated in last sync':data.updated??'—','Rows needing review':data.issues??'—','Last completed':data.finishedAt||'—'})){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=String(value);status.append(dt,dd)}
 if(!response.ok||data.ok===false)error.textContent=data.message||json.error||'Sheet sync could not complete. CRM data remains saved.';
 }catch(e){error.textContent='Unable to read Sheet sync status.'}finally{document.getElementById('sync').disabled=false}
}
document.getElementById('refresh').onclick=()=>load();document.getElementById('sync').onclick=()=>load('POST');load();
</script></body></html>
