<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#2c1405" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Signature CRM" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/assets/signature-mark.svg" type="image/svg+xml" />
<script src="/pwa-register.js" defer></script>
<title>Sign in — Signature Properties</title>
<style>
  :root { --bg:#faf7f2; --card:#fff; --border:#e8ddd0; --text:#1c0a00; --muted:#7a6355; --brown:#2c1405; --gold:#d4a017; --danger:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; }
  .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 12px 32px rgba(44,20,5,.08); }
  .brand { width: 48px; height: 48px; display: block; margin: 0 0 16px; border-radius: 12px; }
  h1 { margin: 0 0 8px; font-size: 28px; color: var(--brown); }
  p { margin: 0; line-height: 1.5; color: var(--muted); }
  .pins { display: flex; gap: 12px; margin-top: 22px; justify-content: space-between; }
  .pins input { width: 100%; height: 64px; text-align: center; font-size: 28px; font-weight: 700; color: var(--text); border: 1.5px solid var(--border); border-radius: 12px; background: #fffdfa; outline: none; transition: border-color .15s, box-shadow .15s; }
  .pins input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,160,23,.18); }
  .status { min-height: 22px; margin: 16px 0 0; font-size: 14px; color: var(--muted); }
  .status.error { color: var(--danger); }
  .status.ok { color: #166534; }
  .btn { display: inline-flex; margin-top: 20px; align-items: center; justify-content: center; width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: var(--brown); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; }
  .btn:hover { background: #4a2410; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .google-btn { margin-top: 12px; background: #fff; color: var(--brown); border: 1px solid var(--border); }
  .google-btn:hover { background: #fffaf3; }
  .hint { margin-top: 14px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <img class="brand" src="/assets/signature-mark.svg" alt="Signature Properties" />
    <h1>Sign in</h1>
    <p>Enter your 4-digit access code to open Signature Properties.</p>
    <form id="pin-form" autocomplete="off">
      <div class="pins">
        <input data-testid="pin-input-0" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 1" />
        <input data-testid="pin-input-1" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 2" />
        <input data-testid="pin-input-2" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 3" />
        <input data-testid="pin-input-3" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Digit 4" />
      </div>
      <button class="btn" id="submit-btn" type="submit" data-testid="pin-submit-button">Unlock</button>
      <button class="btn google-btn" id="google-btn" type="button">Sign in with Google</button>
    </form>
    <div class="status" id="status" data-testid="login-status" aria-live="polite"></div>
    <div class="hint">Enter the code to continue.</div>
  </div>
<script>
  (function () {
    var statusEl = document.getElementById('status');
    var form = document.getElementById('pin-form');
    var submitBtn = document.getElementById('submit-btn');
    var googleBtn = document.getElementById('google-btn');
    var inputs = Array.prototype.slice.call(document.querySelectorAll('.pins input'));

    function safeNextPath(value) {
      try {
        var resolved = new URL(String(value || '/'), window.location.origin);
        if (resolved.origin !== window.location.origin) return '/';
        var p = resolved.pathname;
        if (p === '/login' || p === '/login.html') return '/';
        return p + resolved.search + resolved.hash;
      } catch (_) { return '/'; }
    }

    var nextParam = new URLSearchParams(window.location.search).get('next');
    var next = safeNextPath(nextParam || '/');
    var GOOGLE_REDIRECT_URI = window.location.origin + '/login.html';

    function storeAuthFlowArtifacts(state, browserFlowId) {
      try {
        localStorage.setItem('sig_auth_flow', JSON.stringify({ state: state || '', browserFlowId: browserFlowId || '' }));
      } catch (_) {}
    }

    function readAuthFlowArtifacts() {
      try { return JSON.parse(localStorage.getItem('sig_auth_flow') || '{}'); } catch (_) { return {}; }
    }

    function clearAuthFlowArtifacts() {
      try { localStorage.removeItem('sig_auth_flow'); } catch (_) {}
    }

    function setStatus(msg, kind) {
      statusEl.textContent = msg || '';
      statusEl.className = 'status' + (kind ? ' ' + kind : '');
    }

    function currentCode() {
      return inputs.map(function (i) { return (i.value || '').replace(/\D/g, ''); }).join('');
    }

    inputs.forEach(function (input, idx) {
      input.addEventListener('input', function () {
        input.value = (input.value || '').replace(/\D/g, '').slice(0, 1);
        if (input.value && idx < inputs.length - 1) inputs[idx + 1].focus();
        if (currentCode().length === 4) submit();
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' && !input.value && idx > 0) inputs[idx - 1].focus();
      });
      input.addEventListener('paste', function (e) {
        e.preventDefault();
        var digits = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 4);
        inputs.forEach(function (el, i) { el.value = digits[i] || ''; });
        if (digits.length === 4) submit(); else if (digits.length) inputs[Math.min(digits.length, 3)].focus();
      });
    });

    var submitting = false;
    function submit() {
      if (submitting) return;
      var code = currentCode();
      if (code.length !== 4) { setStatus('Please enter all 4 digits.', 'error'); return; }
      submitting = true;
      submitBtn.disabled = true;
      setStatus('Checking…');
      fetch('/api/auth/pin-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ pin: code })
      }).then(async function (r) {
        var payload = await r.json().catch(function () { return null; });
        if (r.ok && payload && payload.ok) {
          setStatus('Success! Opening…', 'ok');
          var to = safeNextPath((payload.data && payload.data.redirectTo) || next);
          window.location.replace(to);
          return;
        }
        throw new Error((payload && payload.error) || 'Invalid code. Please try again.');
      }).catch(function (err) {
        setStatus(err && err.message ? err.message : 'Invalid code. Please try again.', 'error');
        inputs.forEach(function (el) { el.value = ''; });
        inputs[0].focus();
      }).finally(function () {
        submitting = false;
        submitBtn.disabled = false;
      });
    }

    form.addEventListener('submit', function (e) { e.preventDefault(); submit(); });

    googleBtn.addEventListener('click', function () {
      googleBtn.disabled = true;
      setStatus('Opening Google sign-in…');
      fetch(`/api/auth/login-state?next=${encodeURIComponent(next)}`, { credentials: 'include' })
        .then(async function (r) {
          var payload = await r.json().catch(function () { return null; });
          if (!r.ok || !payload || !payload.ok || !payload.data || !payload.data.signInUrl) {
            throw new Error((payload && payload.error) || 'Google sign-in is not configured');
          }
          storeAuthFlowArtifacts(payload.data.state, payload.data.browserFlowId);
          window.location.assign(payload.data.signInUrl);
        })
        .catch(function (err) {
          setStatus(err && err.message ? err.message : 'Google sign-in is unavailable.', 'error');
          googleBtn.disabled = false;
        });
    });

    async function waitForAuthenticatedSession(attempts, delayMs) {
      attempts = attempts || 8;
      delayMs = delayMs || 250;
      for (var i = 0; i < attempts; i += 1) {
        var response = await fetch('/api/auth/me', { credentials: 'include' });
        if (response.ok) return true;
        await new Promise(function (resolve) { setTimeout(resolve, delayMs); });
      }
      return false;
    }

    async function finishGoogleLogin() {
      var params = new URLSearchParams(window.location.search);
      var hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      var code = params.get('code') || hash.get('code') || '';
      var sessionId = params.get('session_id') || params.get('sessionId') || hash.get('session_id') || hash.get('sessionId') || '';
      if (!code && !sessionId) return;
      var flow = readAuthFlowArtifacts();
      setStatus('Completing Google sign-in…');
      var response = await fetch('/api/auth/session-exchange', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          code: code,
          session_id: sessionId,
          state: params.get('state') || hash.get('state') || flow.state || '',
          redirect_uri: GOOGLE_REDIRECT_URI,
          browser_flow_id: flow.browserFlowId || ''
        })
      });
      var payload = await response.json().catch(function () { return null; });
      if (!response.ok || !payload || !payload.ok) {
        throw new Error((payload && payload.error) || 'Google sign-in is temporarily unavailable. Please try again.');
      }
      clearAuthFlowArtifacts();
      var confirmed = await waitForAuthenticatedSession();
      if (!confirmed) throw new Error('We could not confirm your session. Please try again.');
      var cleanUrl = new URL(window.location.href);
      ['code', 'state', 'session_id', 'sessionId'].forEach(function (key) { cleanUrl.searchParams.delete(key); });
      cleanUrl.hash = '';
      window.history.replaceState({}, '', cleanUrl.toString());
      window.location.replace(safeNextPath((payload.data && payload.data.redirectTo) || next));
    }

    finishGoogleLogin().catch(function (err) {
      clearAuthFlowArtifacts();
      setStatus(err && err.message ? err.message : 'Unable to start sign-in. Please try again.', 'error');
    });

    // If already signed in, skip straight to the app.
    fetch('/api/auth/me', { credentials: 'include' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (me) { if (me && me.ok) window.location.replace(next); })
      .catch(function () {});

    inputs[0].focus();
  })();
</script>
</body>
</html>
