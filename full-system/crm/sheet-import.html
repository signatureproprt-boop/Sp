<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Original Sheet Import — Signature Properties</title>
<style>body{font-family:system-ui;background:#f7f7f6;color:#21140d;margin:0;padding:24px}main{max-width:900px;margin:auto;background:white;border:1px solid #e7e3df;border-radius:12px;padding:24px}a{color:#5c3317}textarea{display:block;width:100%;box-sizing:border-box;min-height:160px;margin:14px 0;border:1px solid #e7e3df;border-radius:8px;padding:12px}button{background:#2c1405;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;margin:4px}button:disabled{opacity:.45;cursor:default}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f7f6;padding:16px;border-radius:8px}.error{color:#b91c1c}</style></head><body><main>
<a href="/admin">← Admin</a><h1>Import original Sheet details</h1><p>Match clients by phone and fill missing basic details. Existing CRM statuses, notes, follow-ups and transactions are preserved. Identity conflicts are skipped for review.</p>
<label for="source">Original Sheet data</label><textarea id="source" spellcheck="false" placeholder="Paste the original Sheet migration data"></textarea>
<label><input id="reviewed" type="checkbox"> Import repeated-number rows as separate source details and retain invalid numbers with an Invalid Number marker. Existing CRM status is preserved.</label>
<button id="preview">Preview matching</button><button id="apply" disabled>Import matched details</button><p id="status" role="status" aria-live="polite"></p><pre id="report"></pre>
</main><script>
const sourceEl=document.getElementById('source'),preview=document.getElementById('preview'),apply=document.getElementById('apply'),status=document.getElementById('status'),report=document.getElementById('report');let token='',source=null;
sourceEl.addEventListener('input',()=>{token='';source=null;apply.disabled=true;});
document.getElementById('reviewed').addEventListener('change',()=>{token='';source=null;apply.disabled=true;});
async function run(mode){preview.disabled=true;apply.disabled=true;status.className='';status.textContent=mode==='preview'?'Matching original Sheet records…':'Saving missing client details…';
try{if(mode==='preview'){source=JSON.parse(sourceEl.value);source.reviewedRows=document.getElementById('reviewed').checked;}const response=await fetch('/api/sync/sheet-migration/'+mode,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({source,token})});const result=await response.json();if(!response.ok||!result.ok)throw Error(result.error||result.message||'Import failed');const data=result.data;token=data.token;
status.textContent=mode==='preview'?`Preview ready: ${data.updated} clients to update, ${data.created} new clients, ${data.issues.length} rows need review.`:`Import saved: ${data.updated} clients updated, ${data.created} created. ${data.issues.length} rows need review.`;
report.textContent=JSON.stringify({sourceRows:data.sourceRows,clientsBefore:data.clientsBefore,clientsAfter:data.clientsAfter,updated:data.updated,created:data.created,issues:data.issues,changes:data.changes},null,2);apply.disabled=mode!=='preview'||data.changes.length===0;
}catch(error){status.className='error';status.textContent=error.message;token='';}finally{preview.disabled=false;}}
preview.addEventListener('click',()=>run('preview'));apply.addEventListener('click',()=>run('commit'));
</script></body></html>
