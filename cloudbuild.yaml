substitutions:
  _REGION: asia-south1
  _SERVICE: signature-realty-crm
  _REPOSITORY: signature-realty
  _IMAGE: signature-realty-crm

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: node:22-alpine
    entrypoint: sh
    args:
      - -c
      - npm install && npm test
    dir: full-system/crm

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
      - -f
      - full-system/crm/Dockerfile
      - full-system/crm

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --execution-environment=gen2
      - --cpu=1
      - --memory=1Gi
      - --min-instances=0
      - --max-instances=10
      - --concurrency=80
      - --timeout=120
      - --update-env-vars=STORAGE_MODE=mongo,MONGO_DB=signature_properties
      - --allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
