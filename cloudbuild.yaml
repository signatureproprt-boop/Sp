substitutions:
  _REGION: asia-south1
  _SERVICE: signature-realty-crm
  _REPOSITORY: signature-realty
  _IMAGE: signature-realty-crm

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: node:22-alpine
    entrypoint: sh
    args:
      - -c
      - npm install && npm test
    dir: full-system/crm

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
      - -f
      - full-system/crm/Dockerfile
      - full-system/crm

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --execution-environment=gen2
      - --cpu=1
      - --memory=1Gi
      - --min-instances=0
      - --max-instances=10
      - --concurrency=80
      - --timeout=120
      - --no-traffic
      - --tag=snapshot-recovery
      - --update-env-vars=STORAGE_MODE=mongo,MONGO_DB=signature_properties,CRM_REPORT_SHEET_ID=1ICS50baVcDnFJt6UMTcvNzBAMDbs6tX19T9TA-4b3uk
      - --remove-env-vars=CRM_EXISTING_REQUIREMENT_SHEET_ID
      - --allow-unauthenticated

  # Pinned traffic must be promoted explicitly after a successful deployment.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        expected_image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID"
        deployment="$(gcloud run services describe ${_SERVICE} --region=${_REGION} --format='csv[no-heading](spec.template.spec.containers[0].image,status.latestCreatedRevisionName)')"
        IFS=, read -r actual_image deployed_revision <<< "$deployment"
        if [ "$actual_image" != "$expected_image" ]; then
          echo "Service template changed after deployment; traffic promotion stopped."
          exit 1
        fi
        test -n "$deployed_revision"
        gcloud run services update-traffic ${_SERVICE} --region=${_REGION} --to-revisions="$deployed_revision=100"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
