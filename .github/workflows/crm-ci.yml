name: CRM CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'full-system/crm/**'
      - '.github/workflows/crm-ci.yml'
  push:
    branches: [main]
    paths:
      - 'full-system/crm/**'
      - '.github/workflows/crm-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
    env:
      MONGO_TEST_URL: mongodb://127.0.0.1:27017
    defaults:
      run:
        working-directory: full-system/crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m unittest discover -s test -p 'test_deploy_residential_worker.py'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:e2e
